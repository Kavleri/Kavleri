name: Metrics
on:
  # Schedule updates (each hour)
  schedule: [{cron: "0 * * * *"}]
  # Lines below let you run workflow manually and on each commit
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Options
          user: Kavleri
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Jakarta
          
          # Plugin: Languages (Tampilkan bahasa pemrograman)
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: lines, bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_analysis_timeout: 15
          
          # Plugin: Isometric Calendar (Kalender 3D)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Plugin: Achievements (DI-SKIP DULU KARENA ERROR)
          # "Unexpected error" biasanya karena akun baru/data belum cukup.
          # Kita matikan dulu biar plugin lain (Lines, Habits) bisa muncul.
          plugin_achievements: no
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C

          # Plugin: Habits (Kebiasaan coding)
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # Plugin: Lines (Statistik baris kode)
          plugin_lines: yes
